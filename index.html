<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Вода">
<link rel="apple-touch-icon" href="icon.png">
<title>Вода</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0a0e1a; color: #fff; min-height: 100vh; overflow-x: hidden; }

  /* НИЖНЯЯ ПАНЕЛЬ НАВИГАЦИИ */
  .tab-bar { 
    display: flex; 
    background: #0f1420; 
    border-top: 1px solid #1a2035; 
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 85px; 
    padding-bottom: env(safe-area-inset-bottom); 
    z-index: 1000;
  }
  .tab { 
    flex: 1; 
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 13px; 
    font-weight: 500; 
    color: #a0adba; /* Исправлен цвет на более светлый */
    cursor: pointer; 
    transition: all 0.2s; 
    position: relative;
  }
  .tab svg {
    margin-bottom: 4px;
    transition: transform 0.2s;
    opacity: 0.8;
  }
  .tab.active { 
    color: #4fc3f7; 
    font-weight: 700;
  }
  .tab.active svg {
    transform: translateY(-2px);
    opacity: 1;
  }
  .tab.active::before {
    content: '';
    position: absolute;
    top: 0;
    width: 45px;
    height: 4px;
    background: #4fc3f7;
    border-radius: 0 0 4px 4px;
  }

  /* СТРАНИЦЫ */
  #page-main { 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    padding: 40px 20px 130px; 
    min-height: 100vh; 
  }
  #page-calendar { 
    padding: 20px 16px 150px; 
    display: none; 
  }

  /* ГЛАВНАЯ СТРАНИЦА КОНТЕНТ */
  .water-info { text-align: center; margin-bottom: 20px; }
  .water-amount { font-size: 44px; font-weight: 700; color: #4fc3f7; line-height: 1; }
  .water-goal { font-size: 15px; color: #a0adba; margin-top: 6px; }
  .water-pct { font-size: 18px; color: #7ec8e3; margin-top: 4px; font-weight: 600; }

  .figure-wrap { position: relative; width: 200px; height: 340px; margin: 0 auto 30px; cursor: pointer; user-select: none; }
  .figure-wrap:active { transform: scale(0.97); }
  .figure-svg { width: 100%; height: 100%; }

  .btn-row { display: flex; gap: 16px; width: 100%; max-width: 320px; }
  .btn-add { flex: 1; background: linear-gradient(135deg, #1a6fa8, #4fc3f7); border: none; border-radius: 18px; padding: 20px; font-size: 18px; font-weight: 700; color: #fff; cursor: pointer; box-shadow: 0 4px 25px rgba(79,195,247,0.3); }
  .btn-undo { width: 60px; background: #1a2035; border: 1px solid #2a3550; border-radius: 18px; font-size: 22px; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .btn-undo:disabled { opacity: 0.3; }

  /* КАЛЕНДАРЬ КОНТЕНТ */
  .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  .cal-title { font-size: 20px; font-weight: 700; color: #fff; }
  .cal-nav { background: #1a2035; border: 1px solid #2a3550; border-radius: 10px; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; color: #4fc3f7; font-size: 20px; }
  
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cal-day-name { text-align: center; font-size: 12px; color: #a0adba; padding-bottom: 10px; font-weight: 600; }
  .cal-day { aspect-ratio: 1; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: #0f1420; border: 1px solid #1a2035; position: relative; }
  .cal-day.today { border-color: #4fc3f7; border-width: 2px; }
  .cal-day-num { font-size: 15px; font-weight: 600; color: #fff; }
  
  .cal-day.green { background: #0d3320; border-color: #2d7a4f; }
  .cal-day.yellow { background: #2a2000; border-color: #7a6000; }
  .cal-day.red { background: #2a0a0a; border-color: #7a2020; }

  .cal-legend { display: flex; flex-direction: column; gap: 12px; margin: 30px 0; }
  .legend-item { display: flex; align-items: center; gap: 12px; font-size: 16px; color: #a0adba; }
  .legend-dot { width: 14px; height: 14px; border-radius: 50%; }

  /* СТАТИСТИКА (Исправлены надписи) */
  .stats-card { background: #0f1420; border: 1px solid #1a2035; border-radius: 16px; padding: 20px; }
  .stats-row { display: flex; justify-content: space-around; text-align: center; }
  .stat-val { font-size: 24px; font-weight: 800; color: #4fc3f7; margin-bottom: 4px; }
  .stat-label { 
    font-size: 10px; 
    color: #8e99af; /* Светло-серый, чтобы было видно */
    margin-top: 4px; 
    text-transform: uppercase; 
    font-weight: 600;
  }
  .stats-title { 
    font-size: 12px; 
    text-transform: uppercase; 
    letter-spacing: 1px; 
    color: #8e99af; 
    margin-bottom: 12px; 
    text-align: center; 
  }

  .ripple { position: absolute; border-radius: 50%; background: rgba(79,195,247,0.3); animation: ripple-anim 0.6s ease-out forwards; pointer-events: none; }
  @keyframes ripple-anim { 0% { transform: scale(0); opacity: 1; } 100% { transform: scale(4); opacity: 0; } }
</style>
</head>
<body>

<div id="page-main">
  <div class="water-info">
    <div class="water-amount" id="amount-display">0 Мл</div>
    <div class="water-goal">Цель: 3000 Мл</div>
    <div class="water-pct" id="pct-display">0%</div>
  </div>

  <div class="figure-wrap" id="figure-wrap" onclick="addWater(event)">
    <svg class="figure-svg" viewBox="0 0 200 360" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <clipPath id="bodyClip">
          <path d="M40,20 L160,20 L145,340 L55,340 Z"/>
        </clipPath>
        <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#4fc3f7" stop-opacity="0.8"/>
          <stop offset="100%" stop-color="#0277bd" stop-opacity="1"/>
        </linearGradient>
      </defs>
      <path d="M40,20 L160,20 L145,340 L55,340 Z" fill="#0f1a2a" />
      <g clip-path="url(#bodyClip)">
        <rect id="water-fill" x="0" y="340" width="200" height="340" fill="url(#waterGrad)" />
        <path id="wave-path" d="M-40 340 Q-10 332 20 340 Q50 348 80 340 Q110 332 140 340 Q170 348 200 340 Q230 332 260 340 L260 400 L-40 400 Z" fill="url(#waterGrad)" opacity="0.5">
          <animateTransform attributeName="transform" type="translate" from="0,0" to="-60,0" dur="2.5s" repeatCount="indefinite"/>
        </path>
      </g>
      <path d="M40,20 L160,20 L145,340 L55,340 Z" fill="none" stroke="#4fc3f7" stroke-width="1.5" opacity="0.4"/>
    </svg>
  </div>

  <div class="btn-row">
    <button class="btn-add" onclick="addWater(null)">+ 250 Мл</button>
    <button class="btn-undo" id="btn-undo" onclick="undoWater()" disabled>↩</button>
  </div>
</div>

<div id="page-calendar">
  <div class="cal-header">
    <div class="cal-nav" onclick="changeMonth(-1)">‹</div>
    <div class="cal-title" id="cal-title">Март 2026</div>
    <div class="cal-nav" onclick="changeMonth(1)">›</div>
  </div>
  
  <div class="cal-grid" id="cal-grid"></div>
  
  <div class="cal-legend">
    <div class="legend-item"><div class="legend-dot" style="background:#4ade80"></div> Норма (100%+)</div>
    <div class="legend-item"><div class="legend-dot" style="background:#fbbf24"></div> 70-99%</div>
    <div class="legend-item"><div class="legend-dot" style="background:#f87171"></div> Меньше 70%</div>
  </div>
  
<div class="stats-card">
    <div class="stats-title">Статистика Месяца</div>
    <div class="stats-row">
      <div class="stat-item">
        <div class="stat-val" id="stat-days">0</div>
        <div class="stat-label">Дней Нормы</div>
      </div>
      <div class="stat-item">
        <div class="stat-val" id="stat-avg">0</div>
        <div class="stat-label">Мл Среднее</div>
      </div>
      <div class="stat-item">
        <div class="stat-val" id="stat-streak">0</div>
        <div class="stat-label">Дней Подряд</div>
      </div>
    </div>
  </div>
</div>

<div class="tab-bar">
  <div class="tab active" id="tab-main" onclick="showPage('main')">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path>
    </svg>
    <span>Сегодня</span>
  </div>
  <div class="tab" id="tab-cal" onclick="showPage('calendar')">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
      <line x1="16" y1="2" x2="16" y2="6"></line>
      <line x1="8" y1="2" x2="8" y2="6"></line>
      <line x1="3" y1="10" x2="21" y2="10"></line>
    </svg>
    <span>Календарь</span>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCwcdl1oZhVUbEaoQ4HkNWmUK60uOZ18UE",
  authDomain: "mister-black-tracker.firebaseapp.com",
  databaseURL: "https://mister-black-tracker-default-rtdb.firebaseio.com",
  projectId: "mister-black-tracker",
  storageBucket: "mister-black-tracker.firebasestorage.app",
  messagingSenderId: "13220057721",
  appId: "1:13220057721:web:589be95a249d6a4c0c3aa8"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const GOAL = 3000;
const STEP = 250;

let todayKey = getTodayKey();
let waterData = {};
let calViewYear = new Date().getFullYear();
let calViewMonth = new Date().getMonth();

function getTodayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function updateUI() {
  const amount = (waterData[todayKey] && waterData[todayKey].amount) || 0;
  const pct = Math.min(100, Math.round(amount / GOAL * 100));
  document.getElementById('amount-display').textContent = amount.toLocaleString() + ' Мл';
  document.getElementById('pct-display').textContent = pct + '%';
  const y = 340 - (pct / 100 * 320);
  document.getElementById('water-fill').setAttribute('y', y);
  document.getElementById('btn-undo').disabled = amount === 0;
}

window.addWater = function(event) {
  todayKey = getTodayKey();
  if (!waterData[todayKey]) waterData[todayKey] = { amount: 0 };
  waterData[todayKey].amount += STEP;
  set(ref(db, 'water'), waterData);

  if (event && event.currentTarget) {
    const wrap = event.currentTarget;
    const ripple = document.createElement('div');
    ripple.className = 'ripple';
    ripple.style.cssText = `left:80px;top:150px;width:40px;height:40px;`;
    wrap.appendChild(ripple);
    setTimeout(() => ripple.remove(), 600);
  }
};

window.undoWater = function() {
  todayKey = getTodayKey();
  if (waterData[todayKey] && waterData[todayKey].amount > 0) {
    waterData[todayKey].amount -= STEP;
    set(ref(db, 'water'), waterData);
  }
};

window.changeMonth = function(dir) {
  calViewMonth += dir;
  if (calViewMonth > 11) { calViewMonth = 0; calViewYear++; }
  if (calViewMonth < 0) { calViewMonth = 11; calViewYear--; }
  renderCalendar();
};

function renderCalendar() {
const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  document.getElementById('cal-title').textContent = `${MONTHS[calViewMonth]} ${calViewYear}`;
  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';

  ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].forEach(d => {
    const el = document.createElement('div');
    el.className = 'cal-day-name';
    el.textContent = d;
    grid.appendChild(el);
  });

  const first = new Date(calViewYear, calViewMonth, 1);
  let start = first.getDay() === 0 ? 7 : first.getDay();
  for (let i = 1; i < start; i++) grid.appendChild(Object.assign(document.createElement('div'), {className:'cal-day empty'}));

  const days = new Date(calViewYear, calViewMonth+1, 0).getDate();
  const today = new Date();
  
  // Переменные для статистики
  let norm = 0, total = 0, count = 0, streak = 0, counting = true;

  for (let d = 1; d <= days; d++) {
    const key = `${calViewYear}-${String(calViewMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const amount = waterData[key] ? waterData[key].amount : 0;
    const el = document.createElement('div');
    el.className = 'cal-day';
    
    if (d === today.getDate() && calViewMonth === today.getMonth() && calViewYear === today.getFullYear()) {
      el.classList.add('today');
    }
    
    if (amount > 0) {
      const p = amount / GOAL * 100;
      if (p >= 100) { el.classList.add('green'); norm++; }
      else if (p >= 70) el.classList.add('yellow');
      else el.classList.add('red');
      
      total += amount; 
      count++;
      
      // Наполняем ячейку числом и литрами
      el.innerHTML = `<div class="cal-day-num">${d}</div><div class="cal-day-ml">${(amount/1000).toFixed(1)}л</div>`;
    } else {
      el.innerHTML = `<div class="cal-day-num">${d}</div>`;
    }
    grid.appendChild(el);
  }

  // ЛОГИКА РАСЧЕТА СТРИКА (Дней подряд)
  // Идем от текущего дня назад к первому числу месяца
  for (let d = today.getDate(); d >= 1; d--) {
    const key = `${calViewYear}-${String(calViewMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const amt = waterData[key] ? waterData[key].amount : 0;
    
    if (counting && amt >= GOAL) {
      streak++;
    } else {
      // Если сегодня еще не допито до нормы, мы не прерываем стрик, 
      // а просто смотрим, что было вчера. Но если пропуск был вчера — стоп.
      if (d !== today.getDate()) counting = false;
    }
  }

  // ВСТАВЛЯЕМ ДАННЫЕ В ТВОИ НОВЫЕ ПОДПИСИ
  document.getElementById('stat-days').textContent = norm;
  document.getElementById('stat-avg').textContent = count > 0 ? Math.round(total/count) : 0;
  document.getElementById('stat-streak').textContent = streak;
}

window.showPage = function(p) {
  document.getElementById('page-main').style.display = p === 'main' ? 'flex' : 'none';
  document.getElementById('page-calendar').style.display = p === 'calendar' ? 'block' : 'none';
  document.getElementById('tab-main').classList.toggle('active', p === 'main');
  document.getElementById('tab-cal').classList.toggle('active', p === 'calendar');
  if (p === 'calendar') renderCalendar();
  window.scrollTo(0,0);
};

onValue(ref(db, 'water'), (s) => {
  waterData = s.val() || {};
  updateUI();
  if (document.getElementById('page-calendar').style.display === 'block') renderCalendar();
});
</script>
</body>
</html>
