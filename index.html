<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Вода">
<title>Вода</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0a0e1a; color: #fff; min-height: 100vh; overflow-x: hidden; }

  .tab-bar { display: flex; background: #0f1420; border-bottom: 1px solid #1a2035; }
  .tab { flex: 1; padding: 14px; text-align: center; font-size: 13px; font-weight: 600; color: #445; cursor: pointer; transition: all 0.2s; }
  .tab.active { color: #4fc3f7; border-bottom: 2px solid #4fc3f7; }

  /* MAIN PAGE */
  #page-main { display: flex; flex-direction: column; align-items: center; padding: 24px 20px 40px; min-height: calc(100vh - 47px); }

  .water-info { text-align: center; margin-bottom: 20px; }
  .water-amount { font-size: 42px; font-weight: 700; color: #4fc3f7; line-height: 1; }
  .water-goal { font-size: 14px; color: #445; margin-top: 4px; }
  .water-pct { font-size: 16px; color: #7ec8e3; margin-top: 2px; font-weight: 600; }

  /* FIGURE */
  .figure-wrap { position: relative; width: 220px; height: 380px; margin: 0 auto 20px; cursor: pointer; user-select: none; }
  .figure-wrap:active { transform: scale(0.98); }
  .figure-svg { width: 100%; height: 100%; filter: drop-shadow(0 0 10px rgba(79,195,247,0.1)); }

  /* BUTTONS */
  .btn-row { display: flex; gap: 16px; width: 100%; max-width: 320px; }
  .btn-add { flex: 1; background: linear-gradient(135deg, #1a6fa8, #4fc3f7); border: none; border-radius: 16px; padding: 18px; font-size: 17px; font-weight: 700; color: #fff; cursor: pointer; transition: all 0.15s; box-shadow: 0 4px 20px rgba(79,195,247,0.3); }
  .btn-add:active { transform: scale(0.96); box-shadow: 0 2px 10px rgba(79,195,247,0.2); }
  .btn-undo { width: 56px; background: #1a2035; border: 1px solid #2a3550; border-radius: 16px; padding: 18px 0; font-size: 20px; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center; }
  .btn-undo:active { transform: scale(0.96); background: #222d45; }
  .btn-undo:disabled { opacity: 0.3; cursor: default; }

  .hint { font-size: 12px; color: #334; margin-top: 12px; text-align: center; }

  /* CALENDAR PAGE */
  #page-calendar { padding: 20px 16px 40px; display: none; }
  .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .cal-title { font-size: 18px; font-weight: 700; color: #fff; }
  .cal-nav { background: #1a2035; border: 1px solid #2a3550; border-radius: 8px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; color: #7ec8e3; }

  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-day-name { text-align: center; font-size: 11px; color: #445; padding: 6px 0; font-weight: 600; text-transform: uppercase; }
  .cal-day { aspect-ratio: 1; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: default; background: #0f1420; border: 1px solid #1a2035; }
  .cal-day.empty { background: transparent; border-color: transparent; }
  .cal-day.today { border-color: #4fc3f7; }
  .cal-day-num { font-size: 14px; font-weight: 600; color: #ccc; }
  .cal-day.green { background: #0d3320; border-color: #2d7a4f; }
  .cal-day.yellow { background: #2a2000; border-color: #7a6000; }
  .cal-day.red { background: #2a0a0a; border-color: #7a2020; }
  .cal-day.future { opacity: 0.3; }
  .cal-day-ml { font-size: 9px; color: #556; margin-top: 1px; }

  .stats-card { background: #0f1420; border: 1px solid #1a2035; border-radius: 12px; padding: 16px; margin-top: 20px; }
  .stats-title { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #445; margin-bottom: 12px; }
  .stats-row { display: flex; justify-content: space-around; }
  .stat-item { text-align: center; }
  .stat-val { font-size: 22px; font-weight: 700; color: #4fc3f7; }
  .stat-label { font-size: 11px; color: #445; margin-top: 2px; }

  .ripple { position: absolute; border-radius: 50%; background: rgba(79,195,247,0.3); animation: ripple-anim 0.6s ease-out forwards; pointer-events: none; }
  @keyframes ripple-anim { 0% { transform: scale(0); opacity: 1; } 100% { transform: scale(4); opacity: 0; } }

  .drop-anim { position: fixed; font-size: 32px; pointer-events: none; animation: drop-fall 1s ease-out forwards; z-index: 999; }
  @keyframes drop-fall { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-80px) scale(0.5); opacity: 0; } }
</style>
</head>
<body>

<div class="tab-bar">
  <div class="tab active" id="tab-main" onclick="showPage('main')">💧 Сегодня</div>
  <div class="tab" id="tab-cal" onclick="showPage('calendar')">📅 Календарь</div>
</div>

<div id="page-main">
  <div class="water-info">
    <div class="water-amount" id="amount-display">0 Мл</div>
    <div class="water-goal">Цель: 3000 Мл</div>
    <div class="water-pct" id="pct-display">0%</div>
  </div>

  <div class="figure-wrap" id="figure-wrap" onclick="addWater(event)">
  <svg class="figure-svg" viewBox="0 0 200 360" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Контур для обрезки воды (строгая форма стакана) -->
        <clipPath id="bodyClip">
          <path d="M40,20 L160,20 L145,340 L55,340 Z"/>
        </clipPath>
        <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#4fc3f7" stop-opacity="0.8"/>
          <stop offset="100%" stop-color="#0277bd" stop-opacity="1"/>
        </linearGradient>
      </defs>

      <!-- Фоновая заливка стакана (чуть светлее фона) -->
      <path d="M40,20 L160,20 L145,340 L55,340 Z" fill="#0f1a2a" />

      <!-- Вода с анимацией волны -->
      <g clip-path="url(#bodyClip)">
        <rect id="water-fill" x="20" y="340" width="160" height="340" fill="url(#waterGrad)" />
        <path id="wave-path" d="M0 340 Q30 332 60 340 Q90 348 120 340 Q150 332 180 340 Q210 348 240 340 L240 400 L0 400 Z" fill="url(#waterGrad)" opacity="0.5">
          <animateTransform attributeName="transform" type="translate" from="0,0" to="-60,0" dur="2.5s" repeatCount="indefinite"/>
        </path>
      </g>

      <!-- Тонкие линии контура стакана -->
      <path d="M40,20 L160,20 L145,340 L55,340 Z" fill="none" stroke="#4fc3f7" stroke-width="1.5" opacity="0.6"/>
      
      <!-- Декоративные грани для объема -->
      <line x1="70" y1="20" x2="75" y2="340" stroke="#4fc3f7" stroke-width="1" opacity="0.2" />
      <line x1="130" y1="20" x2="125" y2="340" stroke="#4fc3f7" stroke-width="1" opacity="0.2" />
      
      <!-- Блик на стекле -->
      <path d="M50,40 L55,300" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.05" />
    </svg>
  </div>

  <div class="btn-row">
    <button class="btn-add" onclick="addWater(null)">+ 250 Мл</button>
    <button class="btn-undo" id="btn-undo" onclick="undoWater()" disabled>↩</button>
  </div>
  <div class="hint">Нажми на фигуру или кнопку</div>
</div>

<div id="page-calendar">
  <div class="cal-header">
    <div class="cal-nav" onclick="changeMonth(-1)">‹</div>
    <div class="cal-title" id="cal-title">Март 2026</div>
    <div class="cal-nav" onclick="changeMonth(1)">›</div>
  </div>
  <div class="cal-grid" id="cal-grid"></div>
  <div class="cal-legend">
    <div class="legend-item"><div class="legend-dot" style="background:#4ade80"></div> Норма (100%+)</div>
    <div class="legend-item"><div class="legend-dot" style="background:#fbbf24"></div> 70-99%</div>
    <div class="legend-item"><div class="legend-dot" style="background:#f87171"></div> < 70%</div>
  </div>
  <div class="stats-card">
    <div class="stats-title">Статистика Месяца</div>
    <div class="stats-row">
      <div class="stat-item">
        <div class="stat-val" id="stat-days">0</div>
        <div class="stat-label">Дней Нормы</div>
      </div>
      <div class="stat-item">
        <div class="stat-val" id="stat-avg">0</div>
        <div class="stat-label">Мл Среднее</div>
      </div>
      <div class="stat-item">
        <div class="stat-val" id="stat-streak">0</div>
        <div class="stat-label">Дней Подряд</div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, get, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCwcdl1oZhVUbEaoQ4HkNWmUK60uOZ18UE",
  authDomain: "mister-black-tracker.firebaseapp.com",
  databaseURL: "https://mister-black-tracker-default-rtdb.firebaseio.com",
  projectId: "mister-black-tracker",
  storageBucket: "mister-black-tracker.firebasestorage.app",
  messagingSenderId: "13220057721",
  appId: "1:13220057721:web:589be95a249d6a4c0c3aa8"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const GOAL = 3000;
const STEP = 250;

let todayKey = getTodayKey();
let waterData = {};
let calViewYear, calViewMonth;

const now = new Date();
calViewYear = now.getFullYear();
calViewMonth = now.getMonth();

function getTodayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function getTodayAmount() {
  return (waterData[todayKey] && waterData[todayKey].amount) || 0;
}

function updateUI() {
  const amount = getTodayAmount();
  const pct = Math.min(100, Math.round(amount / GOAL * 100));
  document.getElementById('amount-display').textContent = amount.toLocaleString() + ' Мл';
  document.getElementById('pct-display').textContent = pct + '%';
  updateFigure(pct);
  document.getElementById('btn-undo').disabled = amount === 0;
}

function updateFigure(pct) {
  const fill = document.getElementById('water-fill');
  const wave = document.getElementById('wave-path');
  const totalHeight = 345; // Высота фигуры
  const fillHeight = (pct / 100) * totalHeight;
  const y = 365 - fillHeight;

  fill.setAttribute('y', y);
  wave.setAttribute('d', 
    `M-40 ${y} Q-10 ${y-6} 20 ${y} Q50 ${y+6} 80 ${y} Q110 ${y-6} 140 ${y} Q170 ${y+6} 200 ${y} Q230 ${y-6} 260 ${y} L260 420 L-40 420 Z`
  );
}

window.addWater = function(event) {
  todayKey = getTodayKey();
  const current = getTodayAmount();
  if (current >= GOAL * 2) return;

  if (!waterData[todayKey]) waterData[todayKey] = { amount: 0, log: [] };
  waterData[todayKey].amount = current + STEP;
  waterData[todayKey].log = waterData[todayKey].log || [];
  waterData[todayKey].log.push(Date.now());

  saveData();
  updateUI();

  if (event && event.currentTarget) {
    const wrap = event.currentTarget;
    const rect = wrap.getBoundingClientRect();
    const x = (event.clientX || rect.left + rect.width/2) - rect.left;
    const y = (event.clientY || rect.top + rect.height/2) - rect.top;
    const ripple = document.createElement('div');
    ripple.className = 'ripple';
    ripple.style.cssText = `left:${x-20}px;top:${y-20}px;width:40px;height:40px;`;
    wrap.appendChild(ripple);
    setTimeout(() => ripple.remove(), 600);
  }

  const drop = document.createElement('div');
  drop.className = 'drop-anim';
  drop.textContent = '💧';
  drop.style.cssText = `left:50%;top:60%;transform:translateX(-50%);`;
  document.body.appendChild(drop);
  setTimeout(() => drop.remove(), 1000);
};

window.undoWater = function() {
  todayKey = getTodayKey();
  const current = getTodayAmount();
  if (current <= 0) return;
  waterData[todayKey].amount = Math.max(0, current - STEP);
  if (waterData[todayKey].log && waterData[todayKey].log.length > 0) {
    waterData[todayKey].log.pop();
  }
  saveData();
  updateUI();
};

let saveTimeout;
function saveData() {
  if (saveTimeout) clearTimeout(saveTimeout);
  saveTimeout = setTimeout(() => {
    set(ref(db, 'water'), waterData);
  }, 500);
}

// Calendar Logic
const MONTHS_RU = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const DAYS_RU = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];

window.changeMonth = function(dir) {
  calViewMonth += dir;
  if (calViewMonth > 11) { calViewMonth = 0; calViewYear++; }
  if (calViewMonth < 0) { calViewMonth = 11; calViewYear--; }
  renderCalendar();
};

function renderCalendar() {
  document.getElementById('cal-title').textContent = `${MONTHS_RU[calViewMonth]} ${calViewYear}`;
  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';

  DAYS_RU.forEach(d => {
    const el = document.createElement('div');
    el.className = 'cal-day-name';
    el.textContent = d;
    grid.appendChild(el);
  });

  const firstDay = new Date(calViewYear, calViewMonth, 1);
  let startDow = firstDay.getDay();
  if (startDow === 0) startDow = 7;

  for (let i = 1; i < startDow; i++) {
    const el = document.createElement('div');
    el.className = 'cal-day empty';
    grid.appendChild(el);
  }

  const daysInMonth = new Date(calViewYear, calViewMonth + 1, 0).getDate();
  const todayNow = new Date();
  let normDays = 0, totalMl = 0, activeDays = 0, streak = 0, countingStreak = true;

  for (let d = 1; d <= daysInMonth; d++) {
    const key = `${calViewYear}-${String(calViewMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const amount = waterData[key] ? waterData[key].amount : 0;
    const pct = amount / GOAL * 100;

    const isToday = (d === todayNow.getDate() && calViewMonth === todayNow.getMonth() && calViewYear === todayNow.getFullYear());
    const isFuture = new Date(calViewYear, calViewMonth, d) > todayNow;

    const el = document.createElement('div');
    el.className = 'cal-day';
    if (isToday) el.classList.add('today');
    if (isFuture) el.classList.add('future');
    else if (amount > 0) {
      if (pct >= 100) { el.classList.add('green'); normDays++; }
      else if (pct >= 70) el.classList.add('yellow');
      else el.classList.add('red');
      totalMl += amount;
      activeDays++;
    }

    const numEl = document.createElement('div');
    numEl.className = 'cal-day-num';
    numEl.textContent = d;
    el.appendChild(numEl);

    grid.appendChild(el);
  }

  document.getElementById('stat-days').textContent = normDays;
  document.getElementById('stat-avg').textContent = activeDays > 0 ? Math.round(totalMl / activeDays) : 0;
  document.getElementById('stat-streak').textContent = streak;
}

window.showPage = function(page) {
  document.getElementById('page-main').style.display = page === 'main' ? 'flex' : 'none';
  document.getElementById('page-calendar').style.display = page === 'calendar' ? 'block' : 'none';
  document.getElementById('tab-main').classList.toggle('active', page === 'main');
  document.getElementById('tab-cal').classList.toggle('active', page === 'calendar');
  if (page === 'calendar') renderCalendar();
};

onValue(ref(db, 'water'), (snapshot) => {
  const data = snapshot.val();
  if (data) waterData = data;
  todayKey = getTodayKey();
  updateUI();
});
</script>
</body>
</html>
